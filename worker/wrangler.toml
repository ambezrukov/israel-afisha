name = "israel-afisha"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Ежедневный запуск сбора: 17:00 и 18:00 UTC = 20:00 по Израилю летом и зимой.
[triggers]
crons = ["0 17 * * *", "0 18 * * *"]

[vars]
OWNER_ID = "66902800"
SITE_URL = "https://ambezrukov.github.io/israel-afisha/"
ALLOWED_ORIGIN = "https://ambezrukov.github.io"

# Хранилище оценок (KV namespace FEEDBACK)
[[kv_namespaces]]
binding = "FEEDBACK"
id = "38046f1f43ef4d39acae29287c636a9c"

# Посредник для kinorai.co.il больше не нужен: класс удалён (миграция v2)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

[[migrations]]
tag = "v2"
deleted_classes = ["Relay"]
