name: Сравнение моделей оценки

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt typesafe-sdk google-genai
      - name: Сравнение
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          FEEDBACK_URL: ${{ secrets.FEEDBACK_URL }}
          FEEDBACK_KEY: ${{ secrets.FEEDBACK_KEY }}
        run: python scripts/eval_scoring.py
