name: Ежедневный сбор афиши

on:
  schedule:
    # 20:00 по Израилю: GitHub знает только UTC, поэтому два запуска —
    # 17:00 UTC (20:00 летом) и 18:00 UTC (20:00 зимой); лишний программа пропускает сама.
    - cron: "0 17 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:       # ручной запуск кнопкой в GitHub
    inputs:
      rescore:
        description: "Только пересчитать оценки собранных событий (без чтения Telegram)"
        type: boolean
        default: false
      force_notify:
        description: "Отправить вечернее сообщение ещё раз, даже если сегодня уже отправляли"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-afisha
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Сбор и разбор постов
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FEEDBACK_URL: ${{ secrets.FEEDBACK_URL }}
          FEEDBACK_KEY: ${{ secrets.FEEDBACK_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          FORCE_NOTIFY: ${{ inputs.force_notify && '1' || '' }}
        run: python -m afisha.main ${{ inputs.rescore && '--rescore' || '' }}

      - name: Сохранить результат
        run: |
          git config user.name "afisha-bot"
          git config user.email "afisha-bot@users.noreply.github.com"
          git add state/state.json
          git diff --cached --quiet || git commit -m "Афиша: обновление $(date -u +%F)"
          git push
