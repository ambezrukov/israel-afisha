name: debug-kinorai
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          FEEDBACK_URL: ${{ secrets.FEEDBACK_URL }}
          FEEDBACK_KEY: ${{ secrets.FEEDBACK_KEY }}
        run: |
          echo "--- прямо с GitHub:"
          curl -s -o /dev/null -w "%{http_code}\n" -A "Mozilla/5.0" https://kinorai.co.il/
          curl -s https://kinorai.co.il/cdn-cgi/trace | grep -E "loc|colo" || true
          RELAY="${FEEDBACK_URL%/api/feedback}/fetch"
          echo "--- через сервер:"
          curl -s -o /dev/null -w "%{http_code}\n" -H "authorization: Bearer $FEEDBACK_KEY" "$RELAY?url=https%3A%2F%2Fkinorai.co.il%2F"
          curl -s -H "authorization: Bearer $FEEDBACK_KEY" "$RELAY?url=https%3A%2F%2Fkinorai.co.il%2Fcdn-cgi%2Ftrace" | grep -E "loc|colo|ip=" | sed 's/ip=.*/ip=скрыт/' || true
