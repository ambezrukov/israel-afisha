# Настройки дайджеста. Меняются здесь, код трогать не нужно.

[telegram]
# Папка в служебном аккаунте, из которой берутся каналы.
folder = "Афиша"
# Помечать ли посты прочитанными после обработки.
mark_read = true
# Сколько последних постов брать из канала при самом первом запуске.
first_run_limit = 100
# Каналы, где анонсы публикуются картинками: картинки отправляются модели всегда.
image_channels = ["TAMAR_TOURS_HAIFA"]
# Для остальных каналов картинка отправляется, только если текста меньше этого числа символов.
image_if_text_shorter_than = 150
# Не больше стольких картинок на один пост.
max_images_per_post = 4

[model]
id = "claude-sonnet-5-5"
effort = "medium"
# Сколько постов отправлять модели за один запрос.
posts_per_request = 8

[events]
timezone = "Asia/Jerusalem"
# Час планового ежедневного сбора по Израилю (расписание в .github/workflows/daily.yml).
run_hour = 20
# Через сколько дней после окончания событие удаляется из файла.
keep_past_days = 3
# Насколько далеко вперёд показываем события.
horizon_days = 365

[top]
# Временные критерии топа (позже заменим на согласованные).
size = 10
# Окно, из которого выбирается топ.
window_days = 30

[profile]
# Личный профиль владельца: по нему модель ставит личную оценку (поле personal).
home_region = "Север"
# Событие вне домашнего региона теряет столько баллов личной оценки…
far_penalty = 3
# …а если общая значимость не ниже этого порога — только столько.
far_penalty_if_major = 1
major_interest = 8
favorite_artists = [
  "Асаф Авидан (Asaf Avidan)",
  "Нога Эрез (Noga Erez)",
  "Каролина (Karolina)",
  "Равид Плотник (Ravid Plotnik, он же Nechi Nech)",
  "Марина Максимилиан (Marina Maximilian)",
  "Лихи Толедано (Lihi Toledano)",
]
taste = """
- Музыкальные фестивали — интересны всегда.
- Музыка: альтернатива, инди, рок, умный рэп и авторская песня выше поп-эстрады.
  Пример: Каста и Леонид Фёдоров заметно интереснее, чем Линда.
- Театр: «Гешер» и другие сильные израильские театры («Габима», «Камери»,
  «Бейт Лессин», Хайфский театр), топовые российские и мировые постановки — высоко.
  Антрепризы (сборные гастрольные спектакли со звёздами ради кассы) — низко.
"""

[tickchak]
# Сайт касс Tickchak LIVE: израильская сцена, которой почти нет в русскоязычных каналах.
enabled = true
# Страницы городов, районов и площадок (адрес после live.tickchak.co.il/).
pages = ["haifa", "haifa-district", "haifa-auditorium", "haifa-theater"]
# Сколько анонсов отправлять модели за один запрос (они короткие).
posts_per_request = 15

# Страницы любимых артистов: адрес → имя. Все их будущие концерты попадают в сбор.
[tickchak.artists]
asaf-avidan = "Асаф Авидан"
noga-erez = "Нога Эрез"
karolina = "Каролина"
ravid-plotnik = "Равид Плотник"
marina-maximilian = "Марина Максимилиан"
lihi-toledano = "Лихи Толедано"

[kinorai]
# Кино на русском (дубляж) от прокатчика «КиноРай». Берём только кинотеатры этих городов;
# залы IMAX — в любом городе.
enabled = true
cities = ["Хайфа"]
# Снимок расписания делает задача на компьютере; старше стольких дней — предупреждение в журнале.
max_snapshot_age_days = 8

[notify]
# Вечернее личное сообщение от бота @IsraelAfishaBot (после сбора, около 20:00).
enabled = true
chat_id = 66902800
site_url = "https://ambezrukov.github.io/israel-afisha/"
# Сколько лучших новых событий присылать и с какой личной оценки (после поправки на географию).
new_count = 5
min_score = 5
# Как далеко вперёд смотреть для «нового» (любимых артистов — без ограничения).
new_horizon_days = 120
# По четвергам: сколько событий в «Моём топе на выходные».
weekend_count = 7
weekend_min_score = 3
